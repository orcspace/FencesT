name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure x64
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test state persistence
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Launch smoke check
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\build\Release\FencesT.exe -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "FencesT exited unexpectedly: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B dist
      - uses: actions/upload-artifact@v6
        with:
          name: FencesT-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
